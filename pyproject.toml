[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testcase-agent"
version = "0.1.0"
description = "Evidence-backed BRD analysis, test cases, traceability and regression workbooks"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "openai>=1.68,<3", "httpx>=0.28,<1", "google-api-python-client>=2.160,<3", "google-auth>=2.38,<3", "python-docx>=1.1,<2", "pymupdf>=1.25,<2", "Pillow>=11,<13", "oletools>=0.60.2", "xlwt==1.3.0", "xlrd>=2.0.1,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
testcase-agent = "testcase_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testcase_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
